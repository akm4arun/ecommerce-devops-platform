name: Ecommerce Platform CI

on: 
  pull_request: 
    branches: 
      - develop
  push: 
    branches: 
      - develop
  workflow_dispatch:

permissions: 
  contents: read

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v

  security-scan:
    name: Python Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security scanner
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

  terraform-validation:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate  
  docker-build:
    name: Docker Build and Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag ecommerce-api-ci:${{ github.sha }} \
            .

      - name: Start Docker container
        run: |
          docker run --detach \
            --publish 5000:5000 \
            --name ecommerce-api-test \
            ecommerce-api-ci:${{ github.sha }}

      - name: Smoke test container health
        run: |
          for i in {1..15}; do
            if curl --fail http://127.0.0.1:5000/health; then
              echo "Container health check passed"
              exit 0
            fi
            echo "Waiting for application to start..."
            sleep 2
          done

          echo "Container health check failed"
          docker logs ecommerce-api-test
          exit 1

      - name: Smoke test readiness
        run: |
          curl --fail http://127.0.0.1:5000/ready
          echo "Container readiness check passed"

      - name: Stop test container
        if: always()
        run: docker rm --force ecommerce-api-test || true
