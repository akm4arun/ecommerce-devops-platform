name: Ecommerce Platform CI

on: 
  pull_request: 
    branches: 
      - develop
  push: 
    branches: 
      - develop
  workflow_dispatch:

permissions: 
  contents: read

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v

  security-scan:
    name: Python Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security scanner
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

  terraform-validation:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate  
  docker-build:
    name: Docker Build and Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag ecommerce-api-ci:${{ github.sha }} \
            .

      - name: Start Docker container
        run: |
          docker run --detach \
            --publish 5000:5000 \
            --name ecommerce-api-test \
            ecommerce-api-ci:${{ github.sha }}

      - name: Smoke test container health
        run: |
          for i in {1..15}; do
            if curl --fail http://127.0.0.1:5000/health; then
              echo "Container health check passed"
              exit 0
            fi
            echo "Waiting for application to start..."
            sleep 2
          done

          echo "Container health check failed"
          docker logs ecommerce-api-test
          exit 1

      - name: Smoke test readiness
        run: |
          curl --fail http://127.0.0.1:5000/ready
          echo "Container readiness check passed"

      - name: Stop test container
        if: always()
        run: docker rm --force ecommerce-api-test || true
  ecr-push:
    name: Build and Push Image to ECR
    runs-on: ubuntu-latest

    permissions: 
      id-token: write
      contents: read

    needs: 
      - python-tests
      - security-scan
      - terraform-validation
      - docker-build

    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/phase14-canary')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::099731416734:role/ecommerce-github-actions-ecr-push-role
          aws-region: ap-south-2

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag "$REGISTRY/ecommerce-devops-platform:$IMAGE_TAG" \
            .

      - name: Push Docker image to ECR
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            "$REGISTRY/ecommerce-devops-platform:$IMAGE_TAG"


  deploy-blue-green:
    name: Deploy Blue and Green to K3s
    runs-on: [self-hosted, k3s-deploy]

    needs:
      - ecr-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment manifest
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed \
            "s|099731416734.dkr.ecr.ap-south-2.amazonaws.com/ecommerce-devops-platform:IMAGE_TAG|099731416734.dkr.ecr.ap-south-2.amazonaws.com/ecommerce-devops-platform:${IMAGE_TAG}|g" \
            kubernetes/blue-green.yaml \
            > /tmp/blue-green-deploy.yaml

          echo "Deployment image:"
          grep "image:" /tmp/blue-green-deploy.yaml

      - name: Deploy Blue and Green
        run: |
          kubectl apply -f /tmp/blue-green-deploy.yaml

      - name: Verify Blue and Green
        run: |
          kubectl rollout status deployment/ecommerce-api-blue \
            -n ecommerce-dev \
            --timeout=180s

          kubectl rollout status deployment/ecommerce-api-green \
            -n ecommerce-dev \
            --timeout=180s

          kubectl get deployment,pod \
            -n ecommerce-dev \
            -l 'deployment-color in (blue,green)' \
            -o wide
  deploy-canary:
    name: Deploy Canary to K3s
    runs-on: [self-hosted, k3s-deploy]

    needs:
      - ecr-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/phase14-canary'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Canary deployment manifest
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed \
            "s|099731416734.dkr.ecr.ap-south-2.amazonaws.com/ecommerce-devops-platform:IMAGE_TAG|099731416734.dkr.ecr.ap-south-2.amazonaws.com/ecommerce-devops-platform:${IMAGE_TAG}|g" \
            kubernetes/canary.yaml \
            > /tmp/canary-deploy.yaml

          echo "Canary deployment image:"
          grep "image:" /tmp/canary-deploy.yaml

      - name: Deploy Canary
        run: |
          kubectl apply -f /tmp/canary-deploy.yaml
          kubectl apply -f kubernetes/canary-service.yaml

      - name: Verify Canary
        run: |
          kubectl rollout status deployment/ecommerce-api-canary \
            -n ecommerce-dev \
            --timeout=180s

          kubectl get deployment,pod,service \
            -n ecommerce-dev \
            -l 'deployment-track=canary' \
            -o wide
