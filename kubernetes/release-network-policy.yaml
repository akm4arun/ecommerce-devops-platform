apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ecommerce-api-release-ingress-policy
  namespace: ecommerce-dev
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - ecommerce-api-blue
          - ecommerce-api-green
          - ecommerce-api-canary
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 5000
    - from:
        - podSelector:
            matchLabels:
              role: ecommerce-client
      ports:
        - protocol: TCP
          port: 5000
